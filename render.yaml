services:
  - type: web
    name: open-import-os
    runtime: node
    plan: free
    branch: deploy-public
    buildCommand: pnpm install --no-frozen-lockfile && pnpm run build
    startCommand: node --import tsx apps/web/server.mjs
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_VERSION
        value: "20.11.0"
      - key: HOST
        value: "0.0.0.0"
      - key: PORT
        value: "10000"
      - key: DATA_MODE
        value: "DEMO"
      - key: OUTBOUND_SEND_ENABLED
        value: "false"
      - key: REAL_PAYMENT
        value: "false"
      - key: EXTERNAL_LLM
        value: "false"
      - key: SESSION_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: open-import-os-db
          property: connectionString

databases:
  - name: open-import-os-db
    plan: free
    databaseName: open_import_os_demo
    user: postgres
